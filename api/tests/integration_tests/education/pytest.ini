[tool:pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=controllers.edu
    --cov=services
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=80
markers =
    integration: marks tests as integration tests
    slow: marks tests as slow running
    agent: marks tests related to agent functionality
    workflow: marks tests related to workflow functionality
    rag: marks tests related to RAG functionality
    file: marks tests related to file operations
    performance: marks tests as performance tests
    auth: marks tests related to authentication
    group: marks tests related to group management
    session: marks tests related to session management
    template: marks tests related to template management
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
env_files =
    .env.test
timeout = 300
asyncio_mode = auto