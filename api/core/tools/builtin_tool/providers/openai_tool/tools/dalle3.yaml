description:
  human:
    en_US: DALL-E is a text to image tool
    zh_Hans: DALL-E 是一个文本到图像的工具
    ko_KR: DALL-E는 텍스트에서 이미지를 생성하는 도구입니다.
  llm: DALL-E is a tool used to generate images from text
extra:
  python:
    source: tools/dalle3.py
identity:
  author: langgenius
  description:
    en_US: DALL-E 3 is a powerful drawing tool that can draw the image you want based
      on your prompt, compared to DallE 2, DallE 3 has stronger drawing ability, but
      it will consume more resources
      on your prompt, compared to DallE 2, DallE 3 has stronger drawing ability, but
      it will consume more resources
    zh_Hans: DALL-E 3 是一个强大的绘画工具，它可以根据您的提示词绘制出您想要的图像，相比于DallE 2， DallE 3拥有更强的绘画能力，但会消耗更多的资源
    ko_KR: DALL-E 3는 프롬프트를 기반으로 원하는 이미지를 그릴 수 있는 도구입니다. DallE 2에 비해 더 강력한 그리기 능력을 가지고 있지만 더 많은 리소스를 소비합니다.
  label:
    en_US: DALL-E 3
    zh_Hans: DALL-E 3 绘画
    ko_KR: DALL-E 3
  name: dalle3
parameters:
- form: llm
  human_description:
    en_US: Image prompt, you can check the official documentation of DallE 3
    zh_Hans: 图像提示词，您可以查看 DallE 3 的官方文档
    ko_KR: 이미지 프롬프트입니다. DallE 3 공식 문서를 참조하세요.
  label:
    en_US: Prompt
    zh_Hans: 提示词
    ko_KR: 프롬프트
  llm_description: Image prompt of DallE 3, you should describe the image you want
    to generate as a list of words as possible as detailed
  name: prompt
  required: true
  type: string
  default: "A beautiful sunset over mountains, watercolor painting style"
- default: square
  form: form
  human_description:
    en_US: selecting the image size
    zh_Hans: 选择图像大小
    ko_KR: 이미지 크기 선택
  label:
    en_US: Image size
    zh_Hans: 图像大小
    ko_KR: 이미지 크기
  name: size
  options:
  - label:
      en_US: Squre(1024x1024)
      zh_Hans: 方(1024x1024)
      ko_KR: 정사각형(1024x1024)
    value: square
  - label:
      en_US: Vertical(1024x1792)
      zh_Hans: 竖屏(1024x1792)
      ko_KR: 세로(1024x1792)
    value: vertical
  - label:
      en_US: Horizontal(1792x1024)
      zh_Hans: 横屏(1792x1024)
      ko_KR: 가로(1792x1024)
    value: horizontal
  required: true
  type: select
- default: 1
  form: form
  human_description:
    en_US: selecting the number of images
    zh_Hans: 选择图像数量
    ko_KR: 이미지 개수 선택
  label:
    en_US: Number of images
    zh_Hans: 图像数量
    ko_KR: 이미지 개수
  max: 1
  min: 1
  name: n
  required: true
  type: number
- default: standard
  form: form
  human_description:
    en_US: selecting the image quality
    zh_Hans: 选择图像质量
    ko_KR: 이미지 품질 선택
  label:
    en_US: Image quality
    zh_Hans: 图像质量
    ko_KR: 이미지 품질
  name: quality
  options:
  - label:
      en_US: Standard
      zh_Hans: 标准
      ko_KR: 표준
    value: standard
  - label:
      en_US: HD
      zh_Hans: 高清
      ko_KR: 고화질
    value: hd
  required: true
  type: select
- default: vivid
  form: form
  human_description:
    en_US: selecting the image style
    zh_Hans: 选择图像风格
    ko_KR: 이미지 스타일 선택
  label:
    en_US: Image style
    zh_Hans: 图像风格
    ko_KR: 이미지 스타일
  name: style
  options:
  - label:
      en_US: Vivid
      zh_Hans: 生动
      ko_KR: 생생함
    value: vivid
  - label:
      en_US: Natural
      zh_Hans: 自然
      ko_KR: 자연스러움
    value: natural
  required: true
  type: select
