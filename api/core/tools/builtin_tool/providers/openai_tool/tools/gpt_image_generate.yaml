description:
  human:
    en_US: GPT Image Generate (gpt-image-1) is a text to image generation tool
    zh_Hans: GPT Image Generate (gpt-image-1) 是一个文本到图像的生成工具
    ko_KR: GPT Image Generate는 텍스트에서 이미지를 생성하는 도구입니다.
  llm: GPT Image Generate is a tool used to generate images from text using OpenAI's gpt-image-1 model
extra:
  python:
    source: tools/gpt_image_generate.py
identity:
  author: Kalo Chin
  description:
    en_US: GPT Image Generate is OpenAI's most advanced model for image generation, featuring superior instruction following, text rendering, and real-world knowledge.
    zh_Hans: GPT Image Generate 是 OpenAI 最先进的图像生成模型，具有卓越的指令遵循、文本渲染和真实世界知识。
    ko_KR: GPT Image Generate는 OpenAI의 가장 진보된 이미지 생성 모델로, 뛰어난 지시 준수, 텍스트 렌더링 및 실제 지식을 제공합니다.
  label:
    en_US: GPT Image Generate
    zh_Hans: GPT 图像生成
    ko_KR: GPT 이미지 생성
  name: gpt_image_generate
parameters:
- form: llm
  human_description:
    en_US: Detailed description of the image you want to generate (max 32000 chars). Check the official OpenAI documentation for GPT Image.
    zh_Hans: 您想要生成的图像的详细描述（最多 32000 字符）。请查看 GPT Image 的 OpenAI 官方文档。
    ko_KR: 생성하려는 이미지에 대한 상세한 설명입니다 (최대 32000자). GPT Image의 공식 OpenAI 문서를 확인하세요.
  label:
    en_US: Prompt
    zh_Hans: 提示词
    ko_KR: 프롬프트
  llm_description: Detailed image prompt for GPT Image (max 32000 characters). Describe the desired image clearly.
  name: prompt
  required: true
  type: string
  default: "A beautiful sunset over mountains with vibrant orange and purple colors"
- default: auto
  form: form
  human_description:
    en_US: Select the image size
    zh_Hans: 选择图像大小
    ko_KR: 이미지 크기를 선택하세요
  label:
    en_US: Image size
    zh_Hans: 图像大小
    ko_KR: 이미지 크기
  name: size
  options:
  - label:
      en_US: Auto
      zh_Hans: 自动
      ko_KR: 자동
    value: auto
  - label:
      en_US: Square (1024x1024)
      zh_Hans: 方形 (1024x1024)
      ko_KR: 정사각형 (1024x1024)
    value: "1024x1024"
  - label:
      en_US: Portrait (1024x1536)
      zh_Hans: 竖屏/肖像 (1024x1536)
      ko_KR: 세로 (1024x1536)
    value: "1024x1536"
  - label:
      en_US: Landscape (1536x1024)
      zh_Hans: 横屏/风景 (1536x1024)
      ko_KR: 가로 (1536x1024)
    value: "1536x1024"
  required: false
  type: select
- default: 1
  form: form
  human_description:
    en_US: Number of images to generate (Must be less than 10).
    zh_Hans: 要生成的图像数量（必须小于 10）。
    ko_KR: 생성할 이미지 수 (10 미만이어야 함)입니다.
  label:
    en_US: Number of images
    zh_Hans: 图像数量
    ko_KR: 이미지 수
  max: 10
  min: 1
  name: n
  required: false
  type: number
- default: auto
  form: form
  human_description:
    en_US: Select the image quality
    zh_Hans: 选择图像质量
    ko_KR: 이미지 품질을 선택하세요
  label:
    en_US: Image quality
    zh_Hans: 图像质量
    ko_KR: 이미지 품질
  name: quality
  options:
  - label:
      en_US: Auto
      zh_Hans: 自动
      ko_KR: 자동
    value: auto
  - label:
      en_US: Low
      zh_Hans: 低
      ko_KR: 낮음
    value: low
  - label:
      en_US: Medium
      zh_Hans: 中
      ko_KR: 중간
    value: medium
  - label:
      en_US: High
      zh_Hans: 高
      ko_KR: 높음
    value: high
  required: false
  type: select
- default: auto
  form: form
  human_description:
    en_US: Select the image background type. Transparent requires PNG or WebP format and works best with medium/high quality.
    zh_Hans: 选择图像背景类型。透明背景需要 PNG 或 WebP 格式，并且最适用于中/高质量。
    ko_KR: 이미지 배경 유형을 선택하세요. 투명은 PNG 또는 WebP 형식이 필요하며 중간/높은 품질에서 가장 잘 작동합니다.
  label:
    en_US: Background
    zh_Hans: 背景
    ko_KR: 배경
  name: background
  options:
  - label:
      en_US: Auto
      zh_Hans: 自动
      ko_KR: 자동
    value: auto
  - label:
      en_US: Opaque
      zh_Hans: 不透明
      ko_KR: 불투명
    value: opaque
  - label:
      en_US: Transparent
      zh_Hans: 透明
      ko_KR: 투명
    value: transparent
  required: false
  type: select
- default: auto
  form: form
  human_description:
    en_US: Select the output image format.
    zh_Hans: 选择输出图像格式。
    ko_KR: 출력 이미지 형식을 선택하세요.
  label:
    en_US: Output Format
    zh_Hans: 输出格式
    ko_KR: 출력 형식
  name: output_format
  options:
  - label:
      en_US: Auto
      zh_Hans: 自动
      ko_KR: 자동
    value: auto
  - label:
      en_US: PNG
      zh_Hans: PNG
      ko_KR: PNG
    value: png
  - label:
      en_US: JPEG
      zh_Hans: JPEG
      ko_KR: JPEG
    value: jpeg
  - label:
      en_US: WebP
      zh_Hans: WebP
      ko_KR: WebP
    value: webp
  required: false
  type: select
- default: 100
  form: form
  human_description:
    en_US: Set compression level (0-100) for JPEG/WebP formats.
    zh_Hans: 设置 JPEG/WebP 格式的压缩级别（0-100）。
    ko_KR: JPEG/WebP 형식의 압축 수준을 설정하세요 (0-100).
  label:
    en_US: Output Compression
    zh_Hans: 输出压缩
    ko_KR: 출력 압축
  name: output_compression
  max: 100
  min: 0
  required: false
  type: number
- default: auto
  form: form
  human_description:
    en_US: Control content moderation level.
    zh_Hans: 控制内容审核级别。
    ko_KR: 콘텐츠 검토 수준을 제어하세요.
  label:
    en_US: Moderation
    zh_Hans: 内容审核
    ko_KR: 콘텐츠 검토
  name: moderation
  options:
  - label:
      en_US: Auto
      zh_Hans: 自动
      ko_KR: 자동
    value: auto
  - label:
      en_US: Low
      zh_Hans: 低
      ko_KR: 낮음
    value: low
  required: false
  type: select
