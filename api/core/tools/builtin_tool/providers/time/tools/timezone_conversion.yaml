identity:
  name: timezone_conversion
  author: zhuhao
  label:
    en_US: convert time to equivalent time zone
    zh_Hans: 时区转换
    ko_KR: 시간대 변환
description:
  human:
    en_US: A tool to convert time to equivalent time zone
    zh_Hans: 时区转换
    ko_KR: 시간을 다른 시간대로 변환하는 도구입니다.
  llm: A tool to convert time to equivalent time zone
parameters:
  - name: current_time
    type: string
    required: true
    form: llm
    label:
      en_US: current time
      zh_Hans: 当前时间
      ko_KR: 현재 시간
    human_description:
      en_US: current time, such as 2024-01-01 00:00:00
      zh_Hans: 当前时间，比如 2024-01-01 00:00:00
      ko_KR: "현재 시간 (예: 2024-01-01 00:00:00)"
    default: "2025-01-01 09:00:00"
  - name: current_timezone
    type: select
    required: true
    form: llm
    label:
      en_US: Current Timezone
      zh_Hans: 当前时区
      ko_KR: 현재 시간대
    human_description:
      en_US: Select current timezone
      zh_Hans: 选择当前时区
      ko_KR: 현재 시간대를 선택하세요
    default: Asia/Seoul
    options:
      - value: Asia/Seoul
        label:
          en_US: Seoul
          zh_Hans: 首尔
          ko_KR: 서울
      - value: Asia/Tokyo
        label:
          en_US: Tokyo
          zh_Hans: 东京
          ko_KR: 도쿄
      - value: America/New_York
        label:
          en_US: New York
          zh_Hans: 纽约
          ko_KR: 뉴욕
      - value: Europe/London
        label:
          en_US: London
          zh_Hans: 伦敦
          ko_KR: 런던
      - value: America/Los_Angeles
        label:
          en_US: Los Angeles
          zh_Hans: 洛杉矶
          ko_KR: LA
  - name: target_timezone
    type: select
    required: true
    form: llm
    label:
      en_US: Target Timezone
      zh_Hans: 目标时区
      ko_KR: 대상 시간대
    human_description:
      en_US: Select target timezone
      zh_Hans: 选择目标时区
      ko_KR: 대상 시간대를 선택하세요
    default: Asia/Tokyo
    options:
      - value: Asia/Seoul
        label:
          en_US: Seoul
          zh_Hans: 首尔
          ko_KR: 서울
      - value: Asia/Tokyo
        label:
          en_US: Tokyo
          zh_Hans: 东京
          ko_KR: 도쿄
      - value: America/New_York
        label:
          en_US: New York
          zh_Hans: 纽约
          ko_KR: 뉴욕
      - value: Europe/London
        label:
          en_US: London
          zh_Hans: 伦敦
          ko_KR: 런던
      - value: America/Los_Angeles
        label:
          en_US: Los Angeles
          zh_Hans: 洛杉矶
          ko_KR: LA
