identity:
  name: timestamp_to_localtime
  author: zhuhao
  label:
    en_US: Timestamp to localtime
    zh_Hans: 时间戳转换
    ko_KR: 타임스탬프를 현지 시간으로
description:
  human:
    en_US: A tool for timestamp convert to localtime
    zh_Hans: 时间戳转换
    ko_KR: 타임스탬프를 현지 시간으로 변환하는 도구입니다.
  llm: A tool for timestamp convert to localtime
parameters:
  - name: timestamp
    type: number
    required: true
    form: llm
    label:
      en_US: Timestamp
      zh_Hans: 时间戳
      ko_KR: 타임스탬프
    human_description:
      en_US: Timestamp
      zh_Hans: 时间戳
      ko_KR: 타임스탬프
    default: 1735689600
  - name: timezone
    type: string
    required: false
    form: llm
    label:
      en_US: Timezone
      zh_Hans: 时区
      ko_KR: 시간대
    human_description:
      en_US: Timezone, such as Asia/Shanghai
      zh_Hans: 时区，比如 Asia/Shanghai
      ko_KR: "시간대 (예: Asia/Seoul)"
    default: Asia/Shanghai
