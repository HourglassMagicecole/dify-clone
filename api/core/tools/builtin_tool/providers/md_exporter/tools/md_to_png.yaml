identity:
  name: md_to_png
  author: bowenliang123
  label:
    en_US: Markdown to PNG images
    zh_Hans: Markdown 转 PNG 图片
    ko_KR: Markdown을 PNG로
description:
  human:
    en_US: Generate PNG images from Markdown text
    zh_Hans: 将 Markdown 转换为 PNG 图片的工具
    ko_KR: Markdown 텍스트에서 PNG 이미지를 생성하는 도구입니다.
  llm: Generate PNG images from Markdown text
parameters:
  - name: md_text
    type: string
    required: true
    label:
      en_US: Markdown text
      zh_Hans: Markdown格式文本
      ko_KR: Markdown 텍스트
    human_description:
      en_US: Markdown text
      zh_Hans: Markdown格式文本
      ko_KR: Markdown 텍스트
    form: llm
    default: "# 샘플 문서\n\n이것은 **마크다운** 텍스트입니다.\n\n- 항목 1\n- 항목 2\n- 항목 3"
  - name: output_filename
    type: string
    required: false
    label:
      en_US: Output Filename
      zh_Hans: 输出文件名
      ko_KR: 출력 파일명
    human_description:
      en_US: Optional custom output file name, and the filename suffix is not required.
      zh_Hans: 可选的自定义输出文件名，后缀名无需指定
      ko_KR: 선택적 사용자 지정 출력 파일명입니다. 파일 확장자는 지정할 필요가 없습니다.
    form: llm
  - name: is_compress
    type: select
    required: false
    default: "false"
    options:
      - value: "true"
        label:
          en_US: "Yes"
          zh_Hans: 是
          ko_KR: 예
      - value: "false"
        label:
          en_US: "No"
          zh_Hans: 否
          ko_KR: 아니오
    label:
      en_US: Generate into ZIP file
      zh_Hans: 是否压缩为ZIP文件
      ko_KR: ZIP 파일로 생성
    human_description:
      en_US: Whether to generate into ZIP file
      zh_Hans: 是否压缩为ZIP文件
      ko_KR: ZIP 파일로 생성할지 여부입니다.
    llm_description: Whether to generate into ZIP file, default to "false"
    form: form
extra:
  python:
    source: tools/md_to_png/md_to_png.py