identity:
  name: tts
  author: hjlarry
  label:
    en_US: Text To Speech
    ko_KR: 텍스트 음성 변환
description:
  human:
    en_US: Convert text to audio file.
    zh_Hans: 将文本转换为音频文件。
    ko_KR: 텍스트를 오디오 파일로 변환합니다.
  llm: Convert text to audio file.
parameters:
  - name: text
    type: string
    required: true
    default: "안녕하세요. 텍스트 음성 변환 테스트입니다."
    label:
      en_US: Text
      zh_Hans: 文本
      ko_KR: 텍스트
    human_description:
      en_US: The text to be converted.
      zh_Hans: 要转换的文本。
      ko_KR: 변환할 텍스트입니다.
    llm_description: The text to be converted.
    form: llm
  - name: model
    type: select
    required: false
    default: "openai#tts-1"
    options:
      - value: "openai#tts-1"
        label:
          en_US: "OpenAI TTS-1 (Fast)"
          ko_KR: "OpenAI TTS-1 (빠름)"
      - value: "openai#tts-1-hd"
        label:
          en_US: "OpenAI TTS-1-HD (High Quality)"
          ko_KR: "OpenAI TTS-1-HD (고품질)"
    label:
      en_US: Model
      zh_Hans: 模型
      ko_KR: 모델
    human_description:
      en_US: The TTS model to use.
      zh_Hans: 要使用的TTS模型。
      ko_KR: 사용할 TTS 모델입니다.
    llm_description: The TTS model to use for text-to-speech conversion.
    form: form
