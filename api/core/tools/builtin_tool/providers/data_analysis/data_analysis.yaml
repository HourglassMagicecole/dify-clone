    en_US: An intelligent data analysis tool based on LLM and natural language interaction, featuring built-in data query and data visualization, as well as report generation capabilities.
    zh_Hans: 基于大模型和自然语言交互的智能数据分析工具，内置数据查询和数据可视化（ChatBI），以及报告生成功能。
    pt_BR: An intelligent data analysis tool based on LLM and natural language interaction, featuring built-in data query and data visualization, as well as report generation capabilities.
    ko_KR: LLM 및 자연어 상호작용 기반의 지능형 데이터 분석 도구로, 데이터 쿼리, 데이터 시각화 및 보고서 생성 기능이 내장되어 있습니다.
