identity:
  name: wikipedia_search
  author: langgenius
  label:
    en_US: WikipediaSearch
    zh_Hans: 维基百科搜索
    pt_BR: WikipediaSearch
    ko_KR: 위키백과 검색
  icon: icon.svg
description:
  human:
    en_US: A tool for performing a Wikipedia search and extracting snippets and webpages.
    zh_Hans: 一个用于执行维基百科搜索并提取片段和网页的工具。
    pt_BR: A tool for performing a Wikipedia search and extracting snippets and webpages.
    ko_KR: 위키백과를 검색하고 요약 및 웹페이지를 추출하는 도구입니다.
  llm: A tool for performing a Wikipedia search and extracting snippets and webpages. Input should be a search query.
parameters:
  - name: query
    type: string
    required: true
    default: "인공지능"
    label:
      en_US: Query string
      zh_Hans: 查询语句
      pt_BR: Query string
      ko_KR: 검색어
    human_description:
      en_US: key words for searching
      zh_Hans: 查询关键词
      pt_BR: key words for searching
      ko_KR: 검색 키워드
    llm_description: key words for searching, this should be in the language of "language" parameter
    form: llm
  - name: language
    type: string
    required: true
    default: ko
    label:
      en_US: Language
      zh_Hans: 语言
      pt_BR: Language
      ko_KR: 언어
    human_description:
      en_US: The language of the Wikipedia to be searched
      zh_Hans: 要搜索的维基百科语言
      pt_BR: The language of the Wikipedia to be searched
      ko_KR: 검색할 위키백과 언어
    llm_description: language of the wikipedia to be searched, only "de" for German, "en" for English, "fr" for French, "hi" for Hindi, "ja" for Japanese, "ko" for Korean, "pl" for Polish, "pt" for Portuguese, "ro" for Romanian, "uk" for Ukrainian, "vi" for Vietnamese, and "zh" for Chinese are supported
    form: llm
    options:
      - value: de
        label:
          en_US: German
          zh_Hans: 德语
          pt_BR: German
          ko_KR: 독일어
      - value: en
        label:
