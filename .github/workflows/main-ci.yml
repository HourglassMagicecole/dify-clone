name: Main CI Pipeline

on:
  pull_request:
    branches: ["main", "develop"]
  push:
    branches: ["main", "develop"]

permissions:
  contents: write
  pull-requests: write
  checks: write
  statuses: write
  actions: read
  security-events: write

concurrency:
  group: main-ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Check which paths were changed to determine which tests to run
  check-changes:
    name: Check Changed Files
    runs-on: ubuntu-latest
    outputs:
      api-changed: ${{ steps.changes.outputs.api }}
      web-changed: ${{ steps.changes.outputs.web }}
      web-edu-changed: ${{ steps.changes.outputs.web-edu }}
      vdb-changed: ${{ steps.changes.outputs.vdb }}
      migration-changed: ${{ steps.changes.outputs.migration }}
      docker-changed: ${{ steps.changes.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            api:
              - 'api/**'
              - '.github/workflows/api-tests.yml'
              - '.github/workflows/backend-ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/web-tests.yml'
              - '.github/workflows/frontend-ci.yml'
            web-edu:
              - 'web-edu/**'
              - '.github/workflows/frontend-ci.yml'
            vdb:
              - 'api/core/rag/datasource/**'
              - 'docker/**'
              - '.github/workflows/vdb-tests.yml'
              - 'api/uv.lock'
              - 'api/pyproject.toml'
            migration:
              - 'api/migrations/**'
              - '.github/workflows/db-migration-test.yml'
            docker:
              - 'docker/**'
              - 'api/Dockerfile'
              - 'web/Dockerfile'
              - 'web-edu/Dockerfile'
              - '.github/workflows/docker-build.yml'

  # Enhanced CI pipelines
  backend-ci:
    name: Backend CI
    needs: check-changes
    if: needs.check-changes.outputs.api-changed == 'true'
    uses: ./.github/workflows/backend-ci.yml

  frontend-ci:
    name: Frontend CI
    needs: check-changes
    if: needs.check-changes.outputs.web-changed == 'true' || needs.check-changes.outputs.web-edu-changed == 'true'
    uses: ./.github/workflows/frontend-ci.yml

  # Legacy tests (maintaining backward compatibility)
  api-tests:
    name: API Tests (Legacy)
    needs: check-changes
    if: needs.check-changes.outputs.api-changed == 'true'
    uses: ./.github/workflows/api-tests.yml

  web-tests:
    name: Web Tests (Legacy)
    needs: check-changes
    if: needs.check-changes.outputs.web-changed == 'true'
    uses: ./.github/workflows/web-tests.yml

  style-check:
    name: Style Check
    uses: ./.github/workflows/style.yml

  vdb-tests:
    name: VDB Tests
    needs: check-changes
    if: needs.check-changes.outputs.vdb-changed == 'true'
    uses: ./.github/workflows/vdb-tests.yml

  db-migration-test:
    name: DB Migration Test
    needs: check-changes
    if: needs.check-changes.outputs.migration-changed == 'true'
    uses: ./.github/workflows/db-migration-test.yml

  docker-build:
    name: Docker Build Test
    needs: check-changes
    if: needs.check-changes.outputs.docker-changed == 'true'
    uses: ./.github/workflows/docker-build.yml

  # Final status check
  ci-status:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs: [
      check-changes,
      backend-ci,
      frontend-ci,
      api-tests,
      web-tests,
      style-check,
      vdb-tests,
      db-migration-test,
      docker-build
    ]
    if: always()

    steps:
      - name: Generate CI summary
        run: |
          echo "### CI Pipeline Results 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|---------|" >> $GITHUB_STEP_SUMMARY

          # Backend CI
          if [[ "${{ needs.check-changes.outputs.api-changed }}" == "true" ]]; then
            if [[ "${{ needs.backend-ci.result }}" == "success" ]]; then
              echo "| Backend CI | ✅ Passed | Enhanced pipeline with security scan |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| Backend CI | ❌ Failed | Check logs for details |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "| Backend CI | ⏭️ Skipped | No changes detected |" >> $GITHUB_STEP_SUMMARY
          fi

          # Frontend CI
          if [[ "${{ needs.check-changes.outputs.web-changed }}" == "true" || "${{ needs.check-changes.outputs.web-edu-changed }}" == "true" ]]; then
            if [[ "${{ needs.frontend-ci.result }}" == "success" ]]; then
              echo "| Frontend CI | ✅ Passed | Enhanced pipeline with performance tests |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| Frontend CI | ❌ Failed | Check logs for details |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "| Frontend CI | ⏭️ Skipped | No changes detected |" >> $GITHUB_STEP_SUMMARY
          fi

          # Style Check
          if [[ "${{ needs.style-check.result }}" == "success" ]]; then
            echo "| Style Check | ✅ Passed | Code formatting validated |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Style Check | ❌ Failed | Fix formatting issues |" >> $GITHUB_STEP_SUMMARY
          fi

          # VDB Tests
          if [[ "${{ needs.check-changes.outputs.vdb-changed }}" == "true" ]]; then
            if [[ "${{ needs.vdb-tests.result }}" == "success" ]]; then
              echo "| VDB Tests | ✅ Passed | Vector database tests |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| VDB Tests | ❌ Failed | Check vector DB configuration |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "| VDB Tests | ⏭️ Skipped | No VDB changes detected |" >> $GITHUB_STEP_SUMMARY
          fi

          # Migration Tests
          if [[ "${{ needs.check-changes.outputs.migration-changed }}" == "true" ]]; then
            if [[ "${{ needs.db-migration-test.result }}" == "success" ]]; then
              echo "| Migration Tests | ✅ Passed | Database migrations validated |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| Migration Tests | ❌ Failed | Check migration scripts |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "| Migration Tests | ⏭️ Skipped | No migration changes |" >> $GITHUB_STEP_SUMMARY
          fi

          # Docker Build
          if [[ "${{ needs.check-changes.outputs.docker-changed }}" == "true" ]]; then
            if [[ "${{ needs.docker-build.result }}" == "success" ]]; then
              echo "| Docker Build | ✅ Passed | Container builds validated |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| Docker Build | ❌ Failed | Check Dockerfile configuration |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "| Docker Build | ⏭️ Skipped | No Docker changes |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check overall status
        run: |
          failed_jobs=()

          if [[ "${{ needs.backend-ci.result }}" == "failure" ]]; then
            failed_jobs+=("Backend CI")
          fi
          if [[ "${{ needs.frontend-ci.result }}" == "failure" ]]; then
            failed_jobs+=("Frontend CI")
          fi
          if [[ "${{ needs.style-check.result }}" == "failure" ]]; then
            failed_jobs+=("Style Check")
          fi
          if [[ "${{ needs.vdb-tests.result }}" == "failure" ]]; then
            failed_jobs+=("VDB Tests")
          fi
          if [[ "${{ needs.db-migration-test.result }}" == "failure" ]]; then
            failed_jobs+=("Migration Tests")
          fi
          if [[ "${{ needs.docker-build.result }}" == "failure" ]]; then
            failed_jobs+=("Docker Build")
          fi

          if [ ${#failed_jobs[@]} -eq 0 ]; then
            echo "🎉 All CI checks passed successfully!"
            exit 0
          else
            echo "❌ Failed jobs: ${failed_jobs[*]}"
            exit 1
          fi
