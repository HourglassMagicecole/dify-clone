name: Docker Build & Security Scan

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'api/Dockerfile'
      - 'web/Dockerfile'
      - 'web-edu/Dockerfile'
      - 'docker/**'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'api/Dockerfile'
      - 'web/Dockerfile'
      - 'web-edu/Dockerfile'
      - 'docker/**'
      - '.github/workflows/docker-build.yml'

concurrency:
  group: docker-build-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

env:
  REGISTRY: ghcr.io
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_PASSWORD: ${{ github.token }}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.changes.outputs.api }}
      web: ${{ steps.changes.outputs.web }}
      web-edu: ${{ steps.changes.outputs.web-edu }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            api:
              - 'api/**'
              - 'docker/**'
            web:
              - 'web/**'
            web-edu:
              - 'web-edu/**'

  build-and-scan:
    name: Build & Scan
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.web-edu == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: api
            dockerfile: api/Dockerfile
            condition: ${{ needs.changes.outputs.api == 'true' }}
          - service: web
            context: web
            dockerfile: web/Dockerfile
            condition: ${{ needs.changes.outputs.web == 'true' }}
          - service: web-edu
            context: web-edu
            dockerfile: web-edu/Dockerfile
            condition: ${{ needs.changes.outputs.web-edu == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        if: matrix.condition

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        if: matrix.condition

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        if: matrix.condition
        with:
          driver-opts: |
            image=moby/buildkit:buildx-stable-1
            network=host

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        if: matrix.condition
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=${{ matrix.service }}
            org.opencontainers.image.description=Dify ${{ matrix.service }} service
            org.opencontainers.image.vendor=Dify.AI

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        if: matrix.condition && github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        if: matrix.condition
        id: build
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=${{ matrix.service }}
            type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:buildcache
          cache-to: |
            type=gha,mode=max,scope=${{ matrix.service }}
            type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:buildcache,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        if: matrix.condition
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ steps.meta.outputs.version }}
          format: 'sarif'
          output: 'trivy-results-${{ matrix.service }}.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: matrix.condition && always()
        with:
          sarif_file: 'trivy-results-${{ matrix.service }}.sarif'
          category: 'trivy-${{ matrix.service }}'

      - name: Generate vulnerability report
        if: matrix.condition && always()
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${{ github.workspace }}:/workspace \
            aquasec/trivy:latest image \
            --format table \
            --output /workspace/trivy-report-${{ matrix.service }}.txt \
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ steps.meta.outputs.version }} || true

      - name: Upload vulnerability reports
        uses: actions/upload-artifact@v4
        if: matrix.condition && always()
        with:
          name: security-reports-${{ matrix.service }}
          path: |
            trivy-results-${{ matrix.service }}.sarif
            trivy-report-${{ matrix.service }}.txt

      - name: Check image size
        if: matrix.condition
        run: |
          IMAGE_SIZE=$(docker image inspect ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ steps.meta.outputs.version }} --format='{{.Size}}' | numfmt --to=iec-i --suffix=B)
          echo "### 🐳 Docker Image: ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Size**: $IMAGE_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- **Tags**: ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Platforms**: linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY

  multi-arch-test:
    name: Multi-Architecture Test
    runs-on: ubuntu-latest
    needs: [changes, build-and-scan]
    if: needs.build-and-scan.result == 'success'
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
        service: [api, web, web-edu]

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Test image on ${{ matrix.platform }}
        run: |
          if [[ "${{ matrix.service }}" == "api" && "${{ needs.changes.outputs.api }}" == "true" ]]; then
            docker run --rm --platform ${{ matrix.platform }} \
              ${{ env.REGISTRY }}/${{ github.repository }}/api:latest \
              python --version
          elif [[ "${{ matrix.service }}" == "web" && "${{ needs.changes.outputs.web }}" == "true" ]]; then
            docker run --rm --platform ${{ matrix.platform }} \
              ${{ env.REGISTRY }}/${{ github.repository }}/web:latest \
              node --version
          elif [[ "${{ matrix.service }}" == "web-edu" && "${{ needs.changes.outputs.web-edu }}" == "true" ]]; then
            docker run --rm --platform ${{ matrix.platform }} \
              ${{ env.REGISTRY }}/${{ github.repository }}/web-edu:latest \
              node --version
          else
            echo "Skipping ${{ matrix.service }} on ${{ matrix.platform }} - no changes detected"
          fi

  status-check:
    name: Docker Build Status
    runs-on: ubuntu-latest
    needs: [changes, build-and-scan, multi-arch-test]
    if: always()

    steps:
      - name: Generate build summary
        run: |
          echo "### Docker Build Results 🐳" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status | Security Scan | Multi-Arch |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|---------------|------------|" >> $GITHUB_STEP_SUMMARY

          # API Service
          if [[ "${{ needs.changes.outputs.api }}" == "true" ]]; then
            if [[ "${{ needs.build-and-scan.result }}" == "success" ]]; then
              echo "| API | ✅ Built | 🔒 Scanned | 🏗️ Tested |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| API | ❌ Failed | ❌ Failed | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "| API | ⏭️ Skipped | ⏭️ Skipped | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          fi

          # Web Service
          if [[ "${{ needs.changes.outputs.web }}" == "true" ]]; then
            if [[ "${{ needs.build-and-scan.result }}" == "success" ]]; then
              echo "| Web | ✅ Built | 🔒 Scanned | 🏗️ Tested |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| Web | ❌ Failed | ❌ Failed | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "| Web | ⏭️ Skipped | ⏭️ Skipped | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          fi

          # Web-EDU Service
          if [[ "${{ needs.changes.outputs.web-edu }}" == "true" ]]; then
            if [[ "${{ needs.build-and-scan.result }}" == "success" ]]; then
              echo "| Web-EDU | ✅ Built | 🔒 Scanned | 🏗️ Tested |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| Web-EDU | ❌ Failed | ❌ Failed | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "| Web-EDU | ⏭️ Skipped | ⏭️ Skipped | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check overall status
        run: |
          if [[ "${{ needs.build-and-scan.result }}" == "success" && "${{ needs.multi-arch-test.result }}" == "success" ]]; then
            echo "🎉 Docker build and security scan completed successfully!"
            exit 0
          else
            echo "❌ Docker build or security scan failed"
            exit 1
          fi
