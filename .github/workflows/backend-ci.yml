name: Backend CI Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'api/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'api/**'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write
  actions: read
  security-events: write

env:
  UV_PYTHON: "3.12"
  PYTHONPATH: ./api

jobs:
  lint-and-format:
    name: Code Quality & Formatting
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup UV and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ env.UV_PYTHON }}
          cache-dependency-glob: api/uv.lock

      - name: Check UV lockfile
        run: uv lock --project api --check

      - name: Install dependencies
        run: uv sync --project api --dev

      - name: Run Ruff format check
        run: |
          cd api
          uv run ruff format --check .

      - name: Run Ruff lint check
        run: |
          cd api
          uv run ruff check .

      - name: Run basedpyright type check
        run: |
          cd api
          uv run basedpyright

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-format
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
        test-group: [unit, config]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup UV and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: api/uv.lock

      - name: Install dependencies
        run: uv sync --project api --dev

      - name: Run Unit Tests
        if: matrix.test-group == 'unit'
        run: |
          uv run --project api bash dev/pytest/pytest_unit_tests.sh

      - name: Run Config Tests
        if: matrix.test-group == 'config'
        run: |
          uv run --project api dev/pytest/pytest_config_tests.py

      - name: Generate coverage report
        if: matrix.test-group == 'unit' && matrix.python-version == '3.12'
        run: |
          cd api
          uv run coverage xml
          uv run coverage json

      - name: Upload coverage reports
        if: matrix.test-group == 'unit' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./api/coverage.xml
          flags: backend-unit
          name: backend-unit-tests

      - name: Coverage Summary
        if: matrix.test-group == 'unit' && matrix.python-version == '3.12'
        run: |
          TOTAL_COVERAGE=$(python -c 'import json; print(json.load(open("api/coverage.json"))["totals"]["percent_covered_display"])')
          echo "### Backend Test Coverage :test_tube:" >> $GITHUB_STEP_SUMMARY
          echo "Total Coverage: ${TOTAL_COVERAGE}%" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          uv run --project api coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        test-suite: [workflow, tools, testcontainers]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup UV and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ env.UV_PYTHON }}
          cache-dependency-glob: api/uv.lock

      - name: Install dependencies
        run: uv sync --project api --dev

      - name: Set up environment files
        run: |
          cp docker/.env.example docker/.env
          cp docker/middleware.env.example docker/middleware.env

      - name: Expose Service Ports
        run: sh .github/workflows/expose_service_ports.sh

      - name: Set up Services
        uses: hoverkraft-tech/compose-action@v2.0.2
        with:
          compose-file: docker/docker-compose.middleware.yaml
          services: |
            db
            redis
            sandbox
            ssrf_proxy

      - name: Setup test config
        run: |
          cp api/tests/integration_tests/.env.example api/tests/integration_tests/.env

      - name: Run Workflow Tests
        if: matrix.test-suite == 'workflow'
        run: uv run --project api bash dev/pytest/pytest_workflow.sh

      - name: Run Tool Tests
        if: matrix.test-suite == 'tools'
        run: uv run --project api bash dev/pytest/pytest_tools.sh

      - name: Run TestContainers Tests
        if: matrix.test-suite == 'testcontainers'
        run: uv run --project api bash dev/pytest/pytest_testcontainers.sh

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint-and-format
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup UV and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ env.UV_PYTHON }}
          cache-dependency-glob: api/uv.lock

      - name: Install dependencies
        run: uv sync --project api --dev

      - name: Run Bandit security scan
        run: |
          cd api
          uv add --dev bandit[toml]
          uv run bandit -r . -f json -o bandit-report.json || true
          uv run bandit -r . -f txt || true

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: api/bandit-report.json

  build-test:
    name: Build Test
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup UV and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ env.UV_PYTHON }}
          cache-dependency-glob: api/uv.lock

      - name: Install dependencies
        run: uv sync --project api

      - name: Test production build
        run: |
          cd api
          uv run gunicorn --bind 0.0.0.0:5001 --worker-class gevent --timeout 200 --preload app:app --dry-run

  status-check:
    name: Backend CI Status
    runs-on: ubuntu-latest
    needs: [lint-and-format, unit-tests, integration-tests, security-scan, build-test]
    if: always()

    steps:
      - name: Check all jobs status
        run: |
          if [[ "${{ needs.lint-and-format.result }}" == "success" && \
                "${{ needs.unit-tests.result }}" == "success" && \
                "${{ needs.integration-tests.result }}" == "success" && \
                "${{ needs.security-scan.result }}" == "success" && \
                "${{ needs.build-test.result }}" == "success" ]]; then
            echo "✅ All backend CI checks passed!"
            exit 0
          else
            echo "❌ Some backend CI checks failed:"
            echo "- Lint & Format: ${{ needs.lint-and-format.result }}"
            echo "- Unit Tests: ${{ needs.unit-tests.result }}"
            echo "- Integration Tests: ${{ needs.integration-tests.result }}"
            echo "- Security Scan: ${{ needs.security-scan.result }}"
            echo "- Build Test: ${{ needs.build-test.result }}"
            exit 1
          fi